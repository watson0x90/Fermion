<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="">
  <title>Frida API reference</title>
  <!-- Shared app styles: theme tokens, fonts and the title bar. -->
  <link rel="stylesheet" href="../src/renderer.bundle.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    .dialog { display: grid; grid-template-rows: 38px minmax(0, 1fr); height: 100%; background: var(--bg); color: var(--fg); }
    .docs { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 0; }
    .docs-side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--panel); }
    .docs-search { margin: 10px; display: flex; align-items: center; border: 1px solid var(--border); background: var(--elev); border-radius: 7px; padding: 3px 9px; }
    .docs-search:focus-within { border-color: var(--accent); }
    .docs-search input { flex: 1; min-width: 0; height: 24px; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 12.5px; }
    .docs-search input::placeholder { color: var(--faint); }
    .docs-count { padding: 0 12px 6px; font-size: 11px; color: var(--faint); }
    .docs-topics { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 6px 10px; }
    .docs-topics button span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .docs-topics .k { flex: 0 0 auto; }
    .docs-topics button { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; color: var(--fg); font: 12.5px/1.4 "IBM Plex Mono", ui-monospace, monospace; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    .docs-topics button:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
    .docs-topics button.on { background: color-mix(in srgb, var(--accent) 18%, transparent); box-shadow: inset 2.5px 0 0 var(--accent); }
    .docs-topics .k { margin-left: auto; font: 10px/1 "IBM Plex Sans", system-ui, sans-serif; color: var(--faint); }
    .docs-main { min-height: 0; overflow: auto; padding: 18px 24px 28px; background: var(--editor-bg); user-select: text; }
    .docs-main h1 { margin: 0 0 4px; font: 600 20px/1.3 "IBM Plex Mono", ui-monospace, monospace; }
    .docs-main .kind { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--faint); }
    .docs-main h2 { margin: 26px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    .docs-main pre.sig { margin: 8px 0 0; padding: 7px 10px; background: var(--elev); border: 1px solid var(--border); border-radius: 7px; font: 12px/1.5 "IBM Plex Mono", ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .docs-main p.doc { margin: 10px 0 0; font-size: 13px; line-height: 1.55; white-space: pre-wrap; max-width: 78ch; }
    .docs-main .member { padding: 10px 0 12px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
    .docs-main .member h3 { margin: 0; font: 600 13px/1.4 "IBM Plex Mono", ui-monospace, monospace; }
    .docs-main .member .mk { margin-left: 8px; font: 400 10.5px/1 "IBM Plex Sans", system-ui, sans-serif; color: var(--faint); }
    .docs-main .hit { background: color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 3px; }
    .docs-empty { color: var(--muted); font-size: 13px; max-width: 60ch; line-height: 1.55; }
    .docs-empty code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
  </style>
</head>

<body>
  <div class="dialog" data-testid="docs-dialog">
    <div class="titlebar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none" />
          <ellipse cx="12" cy="12" rx="10" ry="4.3" />
          <ellipse cx="12" cy="12" rx="10" ry="4.3" transform="rotate(60 12 12)" />
          <ellipse cx="12" cy="12" rx="10" ry="4.3" transform="rotate(120 12 12)" />
        </svg>
        <span class="sub">Frida JavaScript API</span>
      </div>
      <div class="sp"></div>
      <div class="winctl">
        <button class="close" id="CloseDialog" data-testid="dialog-close" title="Close">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
    </div>

    <div class="docs">
      <div class="docs-side">
        <label class="docs-search"><input id="DocsSearch" data-testid="docs-search" type="text" placeholder="Search names" autofocus></label>
        <div class="docs-count" id="DocsCount" data-testid="docs-count"></div>
        <div class="docs-topics" id="DocsTopics" data-testid="docs-topics"></div>
      </div>
      <div class="docs-main" id="DocsMain" data-testid="docs-main"></div>
    </div>
  </div>

  <script src="../src/dialog-theme.js"></script>
  <script src="../src/docs-model.js"></script>
  <script>
    // The reference is drawn from the same index as the REPL's `help`
    // (src/frida-help.json, generated from the Frida type definitions when the
    // app is built), so it always matches the installed Frida. Everything is
    // inserted as text, never as HTML.
    (function () {
      var topicsEl = document.getElementById('DocsTopics');
      var mainEl = document.getElementById('DocsMain');
      var countEl = document.getElementById('DocsCount');
      var searchEl = document.getElementById('DocsSearch');
      var topics = [];
      var selected = null;

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }

      function signatures(parent, sigs) {
        for (var i = 0; i < sigs.length; i++) parent.appendChild(el('pre', 'sig', sigs[i]));
      }

      function showTopic(topic) {
        selected = topic.name;
        var needle = searchEl.value.trim().toLowerCase();
        mainEl.textContent = '';
        mainEl.appendChild(el('div', 'kind', topic.kind || 'name'));
        mainEl.appendChild(el('h1', '', topic.name));
        signatures(mainEl, topic.sigs);
        if (topic.doc) mainEl.appendChild(el('p', 'doc', window.FermionDocs.reflow(topic.doc)));
        if (topic.members.length) {
          mainEl.appendChild(el('h2', '', topic.members.length + (topic.members.length === 1 ? ' member' : ' members')));
          var firstHit = null;
          for (var i = 0; i < topic.members.length; i++) {
            var m = topic.members[i];
            var box = el('div', 'member');
            var h = el('h3', '');
            var name = el('span', needle && m.name.toLowerCase().indexOf(needle) !== -1 ? 'hit' : '', topic.name + '.' + m.name);
            if (name.className && !firstHit) firstHit = box;
            h.appendChild(name);
            h.appendChild(el('span', 'mk', m.kind));
            box.appendChild(h);
            signatures(box, m.sigs);
            if (m.doc) box.appendChild(el('p', 'doc', window.FermionDocs.reflow(m.doc)));
            mainEl.appendChild(box);
          }
          mainEl.scrollTop = 0;
          if (firstHit) firstHit.scrollIntoView({ block: 'start' });
        } else {
          mainEl.scrollTop = 0;
        }
        var buttons = topicsEl.querySelectorAll('button');
        for (var b = 0; b < buttons.length; b++) buttons[b].classList.toggle('on', buttons[b].dataset.topic === topic.name);
      }

      function renderList() {
        var shown = window.FermionDocs.filterTopics(topics, searchEl.value);
        topicsEl.textContent = '';
        for (var i = 0; i < shown.length; i++) {
          (function (topic) {
            var b = el('button', topic.name === selected ? 'on' : '');
            b.dataset.topic = topic.name;
            b.appendChild(el('span', '', topic.name));
            b.appendChild(el('span', 'k', topic.kind));
            b.onclick = function () { showTopic(topic); };
            topicsEl.appendChild(b);
          })(shown[i]);
        }
        countEl.textContent = searchEl.value.trim() ? shown.length + ' of ' + topics.length + ' topics' : topics.length + ' topics';
        // While searching, show the first match so its members are visible.
        if (searchEl.value.trim() && shown.length) showTopic(shown[0]);
        if (!shown.length) {
          mainEl.textContent = '';
          mainEl.appendChild(el('p', 'docs-empty', 'Nothing in the Frida API matches “' + searchEl.value.trim() + '”.'));
        }
      }

      function intro() {
        mainEl.textContent = '';
        var p = el('p', 'docs-empty');
        p.appendChild(document.createTextNode('Pick a name on the left, or search. This reference is generated from the Frida type definitions that ship with Fermion, so it matches the installed Frida. The same text is available in the REPL: type '));
        p.appendChild(el('code', '', 'help Process'));
        p.appendChild(document.createTextNode('.'));
        mainEl.appendChild(p);
      }

      searchEl.addEventListener('input', renderList);
      document.getElementById('CloseDialog').onclick = function () { window.close(); };
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (searchEl.value) { searchEl.value = ''; renderList(); intro(); selected = null; } else window.close(); } });

      fetch('../src/frida-help.json')
        .then(function (r) { return r.json(); })
        .then(function (index) {
          topics = window.FermionDocs.buildDocsModel(index);
          renderList();
          intro();
        })
        .catch(function () {
          mainEl.appendChild(el('p', 'docs-empty', 'The API reference has not been built. Run "npm run build" in the Fermion folder.'));
        });
    })();
  </script>
</body>

</html>
