<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="">
  <!-- esbuild emits this from the CSS imported by the React bundle (xterm + shell.css). -->
  <link rel="stylesheet" href="../src/renderer.bundle.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Monaco AMD loader (sets global require/define; no node needed). -->
  <script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
  <!-- Monaco theme objects (window.FermionThemes). -->
  <script src="../src/lang/monaco-theme.js"></script>
  <!-- React renderer (esbuild bundle of src/ui/main.tsx). -->
  <script src="../src/renderer.bundle.js"></script>
</body>

</html>
