<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="">
  <title>About Fermion</title>
  <!-- Shared app styles: theme tokens, fonts and the title bar. -->
  <link rel="stylesheet" href="../src/renderer.bundle.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    .dialog { display: grid; grid-template-rows: 38px minmax(0, 1fr); height: 100%; background: var(--bg); color: var(--fg); }
    .about { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 10px 24px 18px; background: var(--panel); }
    .about .logo { display: flex; align-items: flex-end; gap: 14px; }
    .about .logo img { height: 46px; filter: var(--logo-filter); -webkit-user-drag: none; }
    .about .version { font: 500 12.5px/1.2 "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); padding-bottom: 6px; }
    .about .credit { display: flex; align-items: center; gap: 14px; }
    .about .credit img { filter: var(--logo-filter); -webkit-user-drag: none; }
    .about .credit button { border: 0; background: transparent; padding: 0; cursor: pointer; border-radius: 50%; line-height: 0; }
    .about .credit button:hover img { opacity: .7; }
    .about .fork { margin: 0; font-size: 11.5px; color: var(--faint); text-align: center; }
    .about .fork button { border: 0; background: transparent; padding: 0; font: inherit; color: var(--accent); cursor: pointer; }
    .about .fork button:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <div class="dialog" data-testid="about-dialog">
    <div class="titlebar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none" />
          <ellipse cx="12" cy="12" rx="10" ry="4.3" />
          <ellipse cx="12" cy="12" rx="10" ry="4.3" transform="rotate(60 12 12)" />
          <ellipse cx="12" cy="12" rx="10" ry="4.3" transform="rotate(120 12 12)" />
        </svg>
        <span class="sub">About</span>
      </div>
      <div class="sp"></div>
      <div class="winctl">
        <button class="close" id="CloseDialog" data-testid="dialog-close" title="Close">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
    </div>

    <div class="about">
      <div class="logo">
        <img src="../src/images/fermion-alt.png" alt="Fermion">
        <span class="version" id="FermionVersion" data-testid="about-version"></span>
      </div>
      <div class="credit">
        <img src="../src/images/b33f.png" alt="by b33f">
        <img src="../src/images/arrow.png" alt="">
        <button id="OpenOriginal" title="The original Fermion by Ruben Boonen (@FuzzySec)"><img src="../src/images/github.png" alt="FuzzySecurity/Fermion on GitHub"></button>
      </div>
      <p class="fork">Maintained fork: <button id="OpenFork" data-testid="about-fork">github.com/watson0x90/Fermion</button></p>
    </div>
  </div>

  <script src="../src/dialog-theme.js"></script>
  <script>
    document.getElementById('CloseDialog').onclick = function () { window.close(); };

    // The versions actually running.
    window.fermion.versions().then(function (v) {
      document.getElementById('FermionVersion').textContent = 'v' + v.fermion + ' · Frida ' + v.frida;
    }).catch(function () {});

    // Links open in the user's browser (validated by the main process).
    document.getElementById('OpenOriginal').onclick = function () { window.fermion.openExternal('https://github.com/FuzzySecurity/Fermion'); };
    document.getElementById('OpenFork').onclick = function () { window.fermion.openExternal('https://github.com/watson0x90/Fermion'); };
  </script>
</body>

</html>
