name: Tests

# Per-change CI: runs the smoke/regression suite on pushes to master, on pull
# requests targeting master, and on demand. (Release packaging is separate, in
# release.yml, and only runs on version tags.)
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: Fermion

jobs:
  smoke:
    name: Smoke & regression (ubuntu)
    runs-on: ubuntu-latest
    # The whole run takes a few minutes; a test that hangs must not hold a runner for hours.
    timeout-minutes: 20
    # GitHub runners aren't configured for Electron's SUID sandbox (chrome-sandbox
    # is not root-owned), so disable it for the headless smoke launches.
    env:
      ELECTRON_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer bundle
        run: npm run build

      - name: Component tests (Vitest)
        run: npm run test:unit

      # Electron needs a virtual display and its GUI runtime libraries to launch
      # headlessly on a CI runner.
      - name: Install Linux GUI runtime deps
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libgtk-3-0 libgbm1 libasound2t64 libxshmfence1 libdrm2 || \
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libgtk-3-0 libgbm1 libasound2 libxshmfence1 libdrm2

      - name: Unit tests (node:test)
        run: node --test src/*.test.js

      # smoke-frida.js is an Electron main script, so it must be launched by the
      # electron binary (running it with plain `node` makes require('electron')
      # return the path string, not the API).
      - name: Frida load smoke
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/smoke-frida.js

      - name: UI renders smoke
        run: xvfb-run -a node scripts/ui-smoke.js

      - name: Terminal mounts
        run: xvfb-run -a node scripts/ui-test-terminal.js

      - name: console.log capture regression
        run: xvfb-run -a node scripts/ui-test-console-log.js

      - name: Terminal toolbar (filter/search/clear)
        run: xvfb-run -a node scripts/ui-test-toolbar.js

      - name: Child windows open isolated
        run: xvfb-run -a node scripts/ui-test-child-windows.js

      - name: Editor file handling (open, save, recent)
        run: xvfb-run -a node scripts/ui-test-editor-files.js

      - name: Output pane detaches and docks
        run: xvfb-run -a node scripts/ui-test-detach-output.js

      - name: Process tree (hierarchy, filter, attach from row)
        run: xvfb-run -a node scripts/ui-test-process-tree.js

      - name: REPL evaluates in the attached process
        run: xvfb-run -a node scripts/ui-test-repl.js

      - name: Spawn with options, suspended start, start again
        run: xvfb-run -a node scripts/ui-test-launch.js

      - name: Child processes are caught before they run
        run: xvfb-run -a node scripts/ui-test-children.js

      - name: Hooks and bookmarks survive a restart
        run: xvfb-run -a node scripts/ui-test-workspace.js

      - name: Packages are installed, imported and compiled into the script
        run: xvfb-run -a node scripts/ui-test-packages.js

      - name: TypeScript scripts are compiled, type-checked and loaded
        run: xvfb-run -a node scripts/ui-test-typescript.js

      - name: Coverage is recorded and saved as drcov and as a text report
        run: xvfb-run -a node scripts/ui-test-coverage.js

      - name: Memory watch names who reads and writes some bytes
        run: xvfb-run -a node scripts/ui-test-watch.js

      - name: Settings apply at once and survive a restart
        run: xvfb-run -a node scripts/ui-test-settings.js

      - name: Heap tracking finds the block an address is or was in
        run: xvfb-run -a node scripts/ui-test-heap.js

      # Windows APIs: skips on this Linux runner; runs in full on a Windows machine.
      - name: Hook presets decode real Windows API calls
        run: xvfb-run -a node scripts/ui-test-presets.js

      - name: Hooks tab finds, hooks and lists calls
        run: xvfb-run -a node scripts/ui-test-hooks.js

      - name: Inspector reads modules, memory and threads
        run: xvfb-run -a node scripts/ui-test-inspector.js

      - name: Graph traces a function and draws its call graph
        run: xvfb-run -a node scripts/ui-test-graph.js

      - name: One session using the features together
        run: xvfb-run -a node scripts/ui-test-workflow.js

      # End-to-end: attach to a real process and confirm the agent's console.log
      # reaches the terminal. Skips gracefully where the runner can't attach
      # (ptrace restrictions); the real coverage is on the Windows dev machine.
      - name: Attach + console.log end-to-end
        run: xvfb-run -a node scripts/ui-test-attach-console.js
