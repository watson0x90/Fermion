name: Release

# Intentional, maintainer-driven releases: push a version tag (e.g. v2.1.3)
# or run the workflow manually. No cron, no auto-bumping.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: Fermion

permissions:
  contents: write

jobs:
  build:
    name: Build & smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            icon: ./src/images/fermion-ico.ico
          - os: ubuntu-latest
            platform: linux
            arch: x64
            icon: ./src/images/fermion-ico.png
          - os: macos-latest
            platform: darwin
            arch: arm64
            icon: ./src/images/fermion-ico.icns
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer bundle
        run: npm run build

      # Linux needs a virtual display and Electron's runtime libraries to
      # smoke-launch a GUI app headlessly.
      - name: Install Linux GUI runtime deps
        if: matrix.platform == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libgtk-3-0 libgbm1 libasound2t64 libxshmfence1 libdrm2 || \
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libgtk-3-0 libgbm1 libasound2 libxshmfence1 libdrm2

      - name: Package
        run: >
          npx @electron/packager . --platform=${{ matrix.platform }}
          --arch=${{ matrix.arch }} --out build --overwrite
          --icon ${{ matrix.icon }}

      # An entirely unsigned app is killed on launch on Apple Silicon; ad-hoc
      # sign (no certificate/account) so the artifact can actually start.
      - name: Ad-hoc sign (macOS)
        if: matrix.platform == 'darwin'
        run: |
          APP=$(find build -maxdepth 2 -name '*.app' -type d | head -n1)
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      # Smoke-launch the PACKAGED artifact and assert it renders (not just that
      # the process starts). A failure here fails the job and blocks the release.
      - name: Smoke-launch (Windows)
        if: matrix.platform == 'win32'
        run: |
          EXE=$(find build -maxdepth 2 -type f -name 'fermion.exe' | head -n1)
          FERMION_EXE="$EXE" node scripts/ui-smoke.js

      - name: Smoke-launch (Linux)
        if: matrix.platform == 'linux'
        run: |
          EXE=$(find build -maxdepth 2 -type f -name fermion | head -n1)
          chmod +x "$EXE"
          FERMION_EXE="$EXE" xvfb-run -a node scripts/ui-smoke.js

      - name: Smoke-launch (macOS)
        if: matrix.platform == 'darwin'
        run: |
          APP=$(find build -maxdepth 2 -name '*.app' -type d | head -n1)
          EXE="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | head -n1)"
          FERMION_EXE="$EXE" node scripts/ui-smoke.js

      - name: Archive artifact
        run: |
          cd build
          APPDIR=$(ls -d */ | head -n1)
          REF="${GITHUB_REF_NAME//\//-}"   # branch names can contain '/'
          ZIP="fermion-${{ matrix.os }}-${REF}.zip"
          if command -v zip >/dev/null 2>&1; then
            # -y stores symlinks as symlinks. A macOS .app is full of them
            # (framework Versions/Current etc.); following them copied the
            # Electron framework several times over and broke the bundle layout.
            ( cd "$APPDIR" && zip -qry "../$ZIP" . )
          else
            python3 -c "import shutil; shutil.make_archive('${ZIP%.zip}', 'zip', '$APPDIR')"
          fi
          ls -al fermion-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: fermion-${{ matrix.os }}
          path: Fermion/build/fermion-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/fermion-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
